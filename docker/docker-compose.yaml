services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: tcm-postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-mysql:
    image: mysql:8.0.39
    container_name: ragflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${RAGFLOW_MYSQL_DB}
      MYSQL_USER: ${RAGFLOW_MYSQL_USER}
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --binlog_expire_logs_seconds=604800
    volumes:
      - ./data/ragflow/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${RAGFLOW_MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-redis:
    image: valkey/valkey:8
    container_name: ragflow-redis
    command: ["redis-server", "--requirepass", "${RAGFLOW_REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/ragflow/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RAGFLOW_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-es:
    image: elasticsearch:8.11.3
    container_name: ragflow-es
    environment:
      node.name: ragflow-es
      ELASTIC_PASSWORD: ${RAGFLOW_ES_PASSWORD}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./data/ragflow/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow:
    image: infiniflow/ragflow:latest
    container_name: ragflow
    depends_on:
      ragflow-mysql:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
      ragflow-es:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8012:80"
      - "8013:9380"
    environment:
      RAGFLOW_HOST: 0.0.0.0
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${RAGFLOW_MYSQL_USER}
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD}
      MYSQL_DBNAME: ${RAGFLOW_MYSQL_DB}
      REDIS_HOST: ragflow-redis:6379
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD}
      MINIO_HOST: minio
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${RAGFLOW_MINIO_BUCKET}
      ES_HOST: ragflow-es
      ES_USER: elastic
      ELASTIC_PASSWORD: ${RAGFLOW_ES_PASSWORD}
    volumes:
      - ./data/ragflow/logs:/ragflow/logs
    restart: unless-stopped
