services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tcm-agent-backend

    env_file:
      - ../.env

    ports:
      - "${BACKEND_HOST_PORT:-8011}:8011"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - tcm-agent-network


  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend

    container_name: tcm-agent-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_HOST_PORT:-5500}:80"

    restart: unless-stopped

    networks:
      - tcm-agent-network


networks:
  tcm-agent-network:
    driver: bridge
