server {
    listen 80;
    server_name _;

    root /var/www/tcm-dor-prototype;
    index index.html;

    # Vue Router history 模式：刷新子路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
